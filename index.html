<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор компонентов A и B</title>
    
    <!-- PWA Required -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#556B2F">
    <link rel="icon" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">

    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #556B2F;
        }
        .calculator {
            background-color: rgba(255, 255, 255, 0.9);
            padding: 25px;
            border-radius: 20px;
            width: 90%;
            max-width: 450px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        /* Остальные ваши стили остаются без изменений */
    </style>
</head>
<body>
    <div class="calculator">
        <h1>Расчет компонентов A и B</h1>
        <select id="ratio">
            <option value="100:2">Силикон (100:2)</option>
            <option value="10:1">Эпоксидный клей (10:1)</option>
            <option value="60:40">Литьевой пластик (60:40)</option>
        </select>
        <div id="inputFields"></div>
        <button onclick="calculate()">Рассчитать</button>
        <div id="result"></div>
    </div>

    <script>
        // Ваши оригинальные функции калькулятора
        function updateInputFields() {
            const ratio = document.getElementById('ratio').value;
            const inputFieldsDiv = document.getElementById('inputFields');
            
            if (ratio === "100:2" || ratio === "10:1") {
                inputFieldsDiv.innerHTML = `
                    <label>Количество A (г):</label>
                    <input type="number" id="componentA">
                `;
            } else {
                inputFieldsDiv.innerHTML = `
                    <label>Общий вес (г):</label>
                    <input type="number" id="totalWeight">
                `;
            }
        }

        function calculate() {
            const ratio = document.getElementById('ratio').value;
            let result = "";

            if (ratio === "100:2" || ratio === "10:1") {
                const componentA = parseFloat(document.getElementById('componentA').value);
                if (isNaN(componentA)) {
                    result = "Ошибка: введите число";
                } else {
                    const ratioParts = ratio.split(':');
                    const componentB = (componentA * ratioParts[1]) / ratioParts[0];
                    result = `Компонент B: ${componentB.toFixed(2)} г`;
                }
            } else {
                const totalWeight = parseFloat(document.getElementById('totalWeight').value);
                if (isNaN(totalWeight)) {
                    result = "Ошибка: введите число";
                } else {
                    const ratioParts = ratio.split(':');
                    const totalRatio = parseFloat(ratioParts[0]) + parseFloat(ratioParts[1]);
                    const weightA = (totalWeight * ratioParts[0]) / totalRatio;
                    const weightB = (totalWeight * ratioParts[1]) / totalRatio;
                    result = `Компонент A: ${weightA.toFixed(2)} г<br>Компонент B: ${weightB.toFixed(2)} г`;
                }
            }

            document.getElementById('result').innerHTML = result;
        }

        // Инициализация
        document.addEventListener('DOMContentLoaded', () => {
            updateInputFields();
            document.getElementById('ratio').addEventListener('change', updateInputFields);
            
            // Регистрация Service Worker
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('service-worker.js')
                    .then(reg => console.log('SW registered'))
                    .catch(err => console.log('SW registration failed:', err));
            }
        });
    </script>
</body>
</html>
