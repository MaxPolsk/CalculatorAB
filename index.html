<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#556B2F">
    <title>Калькулятор компонентов A и B</title>

    <!-- PWA Required Tags -->
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <link rel="apple-touch-icon" href="icon.png">

    <!-- Favicon -->
    <link rel="icon" href="icon.png" type="image/png">
    <link rel="shortcut icon" href="icon.png" type="image/png">

    <style>
        /* Основные стили */
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #556B2F;
            color: #333;
        }

        .calculator {
            background-color: rgba(255, 255, 255, 0.9);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 20px;
        }

        select, input {
            font-size: 16px;
            padding: 10px;
            margin: 10px 0;
            width: 100%;
            max-width: 300px;
            border: 2px solid #ddd;
            border-radius: 10px;
        }

        button {
            background: linear-gradient(145deg, #007bff, #0056b3);
            color: white;
            font-size: 18px;
            padding: 12px 25px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 15px;
        }

        .result {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
            color: #28a745;
        }

        /* Офлайн-уведомление */
        .offline-notification {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #ff9800;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            display: none;
        }
    </style>
</head>
<body>
    <!-- Уведомление об офлайн-режиме -->
    <div class="offline-notification" id="offlineNotification">Работа в офлайн-режиме</div>

    <!-- Основной контент -->
    <div class="calculator">
        <h1>Расчет компонентов A и B</h1>
        <p>Выберите материал:</p>
        <select id="ratio">
            <option value="100:2">Силикон (100:2)</option>
            <option value="10:1">Эпоксидный клей (10:1)</option>
            <option value="60:40">Литьевой пластик (60:40)</option>
            <option value="100:60">Литьевой пластик (100:60)</option>
            <option value="1:2.5">Акриловый гипс (1:2.5)</option>
        </select>

        <div id="inputFields" class="input-fields">
            <!-- Поля будут генерироваться динамически -->
        </div>

        <button class="calculate-button" onclick="calculate()">Рассчитать</button>
        <div class="result" id="result"></div>
    </div>

    <script>
        // Функции калькулятора
        function updateInputFields() {
            const ratio = document.getElementById('ratio').value;
            const inputFieldsDiv = document.getElementById('inputFields');
            
            if (ratio === "100:2" || ratio === "10:1") {
                inputFieldsDiv.innerHTML = `
                    <label for="componentA">Количество компонента A (г):</label>
                    <input type="number" id="componentA" placeholder="Введите вес">
                `;
            } else {
                inputFieldsDiv.innerHTML = `
                    <label for="totalWeight">Общий вес (г):</label>
                    <input type="number" id="totalWeight" placeholder="Введите общий вес">
                `;
            }
        }

        function calculate() {
            const ratio = document.getElementById('ratio').value;
            let result = "";

            if (ratio === "100:2" || ratio === "10:1") {
                const componentA = parseFloat(document.getElementById('componentA').value);
                if (isNaN(componentA)) {
                    result = "Ошибка: введите число";
                } else {
                    const ratioParts = ratio.split(':');
                    const componentB = (componentA * ratioParts[1]) / ratioParts[0];
                    result = `Компонент B: ${componentB.toFixed(2)} г`;
                }
            } else {
                const totalWeight = parseFloat(document.getElementById('totalWeight').value);
                if (isNaN(totalWeight)) {
                    result = "Ошибка: введите число";
                } else {
                    const ratioParts = ratio.split(':');
                    const totalRatio = parseFloat(ratioParts[0]) + parseFloat(ratioParts[1]);
                    const weightA = (totalWeight * ratioParts[0]) / totalRatio;
                    const weightB = (totalWeight * ratioParts[1]) / totalRatio;
                    result = `Компонент A: ${weightA.toFixed(2)} г<br>Компонент B: ${weightB.toFixed(2)} г`;
                }
            }

            document.getElementById('result').innerHTML = result;
        }

        // Инициализация
        document.addEventListener('DOMContentLoaded', () => {
            updateInputFields();
            document.getElementById('ratio').addEventListener('change', updateInputFields);
            
            // Проверка онлайн-статуса
            updateOnlineStatus();
            window.addEventListener('online', updateOnlineStatus);
            window.addEventListener('offline', updateOnlineStatus);
        });

        // Офлайн-детектор
        function updateOnlineStatus() {
            const notification = document.getElementById('offlineNotification');
            notification.style.display = navigator.onLine ? 'none' : 'block';
        }

        // Регистрация Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('service-worker.js')
                    .then(reg => console.log('ServiceWorker зарегистрирован'))
                    .catch(err => console.log('Ошибка регистрации ServiceWorker:', err));
            });
        }
    </script>
</body>
</html>
