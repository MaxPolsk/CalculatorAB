<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профессиональный калькулятор компонентов</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon.png">
    <style>
        :root {
            --primary: #4a6fa5;
            --secondary: #166088;
            --accent: #4fc3f7;
            --background: #f5f7fa;
            --text: #2d3436;
        }
        
        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background: var(--background);
            color: var(--text);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .calculator-container {
            width: 100%;
            max-width: 500px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        
        .calculator-header {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            padding: 20px;
            text-align: center;
        }
        
        .calculator-body {
            padding: 25px;
        }
        
        select, input {
            width: 100%;
            padding: 12px 15px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s;
        }
        
        select:focus, input:focus {
            border-color: var(--accent);
            outline: none;
            box-shadow: 0 0 0 3px rgba(79, 195, 247, 0.2);
        }
        
        button {
            width: 100%;
            padding: 14px;
            margin-top: 20px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .result {
            margin-top: 25px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
            font-size: 18px;
            text-align: center;
            animation: fadeIn 0.5s;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* Адаптивность */
        @media (max-width: 600px) {
            .calculator-container {
                border-radius: 0;
            }
            body {
                padding: 0;
            }
        }
    </style>
</head>
<body>
    <div class="calculator-container">
        <div class="calculator-header">
            <h1>Калькулятор компонентов A/B</h1>
            <p>Точные пропорции для идеального результата</p>
        </div>
        
        <div class="calculator-body">
            <label for="ratio">Выберите материал:</label>
            <select id="ratio">
                <option value="100:2">Силикон (100:2)</option>
                <option value="10:1">Эпоксидный клей (10:1)</option>
                <option value="60:40">Литьевой пластик (60:40)</option>
            </select>
            
            <div id="inputFields"></div>
            
            <button onclick="calculate()">Рассчитать</button>
            
            <div class="result" id="result"></div>
        </div>
    </div>

    <!-- Сохраняем ваш оригинальный JavaScript -->
    <script>
        function updateInputFields() {
            const ratio = document.getElementById('ratio').value;
            const inputFieldsDiv = document.getElementById('inputFields');
            
            if (ratio === "100:2" || ratio === "10:1") {
                inputFieldsDiv.innerHTML = `
                    <label for="componentA">Количество компонента A (г):</label>
                    <input type="number" id="componentA" placeholder="Введите вес">
                `;
            } else {
                inputFieldsDiv.innerHTML = `
                    <label for="totalWeight">Общий вес (г):</label>
                    <input type="number" id="totalWeight" placeholder="Введите общий вес">
                `;
            }
        }

        function calculate() {
            const ratio = document.getElementById('ratio').value;
            let result = "";

            if (ratio === "100:2" || ratio === "10:1") {
                const componentA = parseFloat(document.getElementById('componentA').value);
                if (isNaN(componentA)) {
                    result = "Ошибка: введите число";
                } else {
                    const ratioParts = ratio.split(':');
                    const componentB = (componentA * ratioParts[1]) / ratioParts[0];
                    result = `Компонент B: <strong>${componentB.toFixed(2)} г</strong>`;
                }
            } else {
                const totalWeight = parseFloat(document.getElementById('totalWeight').value);
                if (isNaN(totalWeight)) {
                    result = "Ошибка: введите число";
                } else {
                    const ratioParts = ratio.split(':');
                    const totalRatio = parseFloat(ratioParts[0]) + parseFloat(ratioParts[1]);
                    const weightA = (totalWeight * ratioParts[0]) / totalRatio;
                    const weightB = (totalWeight * ratioParts[1]) / totalRatio;
                    result = `
                        Компонент A: <strong>${weightA.toFixed(2)} г</strong><br>
                        Компонент B: <strong>${weightB.toFixed(2)} г</strong>
                    `;
                }
            }

            document.getElementById('result').innerHTML = result;
        }

        document.addEventListener('DOMContentLoaded', () => {
            updateInputFields();
            document.getElementById('ratio').addEventListener('change', updateInputFields);
            
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('sw.js');
            }
        });
    </script>
</body>
</html>
