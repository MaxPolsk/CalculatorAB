<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профессиональный калькулятор компонентов</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon.png">
    <style>
        :root {
            --primary: #556B2F;
            --secondary: #6B8E23;
            --accent: #8FBC8F;
            --background: #f5f5f5;
            --text: #333;
        }
        
        body {
            font-family: Arial, sans-serif;
            background: var(--background);
            color: var(--text);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .calculator {
            width: 100%;
            max-width: 500px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        
        .calculator-header {
            background: var(--primary);
            color: white;
            padding: 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .logo-container {
            margin-bottom: 15px;
        }
        
        .logo {
            height: 70px;
            max-width: 100%;
            object-fit: contain;
        }
        
        .calculator-body {
            padding: 25px;
        }
        
        select, input {
            width: 100%;
            padding: 12px;
            margin: 8px 0 16px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
        }
        
        select:focus, input:focus {
            border-color: var(--accent);
            outline: none;
        }
        
        button {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        button:hover {
            background: var(--secondary);
        }
        
        .result {
            margin-top: 20px;
            padding: 15px;
            background: #f9f9f9;
            border-radius: 6px;
            font-size: 16px;
            line-height: 1.6;
        }
        
        .input-group {
            margin-bottom: 15px;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        
        .material-badge {
            display: inline-block;
            padding: 3px 8px;
            background: var(--accent);
            border-radius: 12px;
            font-size: 12px;
            margin-left: 8px;
        }
    </style>
</head>
<body>
    <div class="calculator">
        <div class="calculator-header">
            <div class="logo-container">
                <img src="логотип-5.png" alt="Логотип компании" class="logo">
            </div>
            <h1>Калькулятор компонентов A/B</h1>
        </div>
        
        <div class="calculator-body">
            <div class="input-group">
                <label for="ratio">Выберите материал:</label>
                <select id="ratio">
                    <option value="100:2">Силикон (100:2)</option>
                    <option value="10:1">Эпоксидный клей (10:1)</option>
                    <option value="60:40">Литьевой пластик (60:40)</option>
                    <option value="100:60">Литьевой пластик (100:60)</option>
                    <option value="100:40">Пенополиуретан (100:40)</option>
                    <option value="1:2.5">Акриловый гипс (1:2.5)</option>
                </select>
            </div>
            
            <div id="inputFields" class="input-group">
                <!-- Поля будут генерироваться динамически -->
            </div>
            
            <button onclick="calculate()">Рассчитать</button>
            
            <div class="result" id="result"></div>
        </div>
    </div>

    <script>
        function updateInputFields() {
            const ratio = document.getElementById('ratio').value;
            const inputFieldsDiv = document.getElementById('inputFields');
            inputFieldsDiv.innerHTML = '';

            if (ratio === "100:2" || ratio === "10:1") {
                inputFieldsDiv.innerHTML = `
                    <label for="componentA">Количество компонента A (г):</label>
                    <input type="number" id="componentA" placeholder="Введите вес">
                `;
            } 
            else {
                inputFieldsDiv.innerHTML = `
                    <label for="totalWeight">Общий вес смеси (г):</label>
                    <input type="number" id="totalWeight" placeholder="Введите общий вес">
                `;
            }
        }

        function calculate() {
            const ratio = document.getElementById('ratio').value;
            let result = "";

            if (ratio === "100:2" || ratio === "10:1") {
                const componentA = parseFloat(document.getElementById('componentA').value);

                if (isNaN(componentA) || componentA <= 0) {
                    document.getElementById('result').innerHTML = "Ошибка: Введите положительное число.";
                    return;
                }

                let ratioA, ratioB;
                if (ratio === "100:2") {
                    ratioA = 100;
                    ratioB = 2;
                } else if (ratio === "10:1") {
                    ratioA = 10;
                    ratioB = 1;
                }

                const componentB = (componentA * ratioB) / ratioA;
                result = `Компонент B: <strong>${componentB.toFixed(2)} г</strong>`;
            } 
            else {
                const totalWeight = parseFloat(document.getElementById('totalWeight').value);

                if (isNaN(totalWeight) || totalWeight <= 0) {
                    document.getElementById('result').innerHTML = "Ошибка: Введите положительное число.";
                    return;
                }

                let ratioA, ratioB;
                if (ratio === "60:40") {
                    ratioA = 60;
                    ratioB = 40;
                } else if (ratio === "100:60") {
                    ratioA = 100;
                    ratioB = 60;
                } else if (ratio === "100:40") {
                    ratioA = 100;
                    ratioB = 40;
                } else if (ratio === "1:2.5") {
                    ratioA = 1;
                    ratioB = 2.5;
                }

                const totalRatio = ratioA + ratioB;
                const weightA = (totalWeight * ratioA) / totalRatio;
                const weightB = (totalWeight * ratioB) / totalRatio;

                result = `
                    Компонент A: <strong>${weightA.toFixed(2)} г</strong><br>
                    Компонент B: <strong>${weightB.toFixed(2)} г</strong>
                    <div class="material-badge">Соотношение: ${ratioA}:${ratioB}</div>
                `;
            }

            document.getElementById('result').innerHTML = result;
        }

        // Инициализация
        document.addEventListener('DOMContentLoaded', () => {
            updateInputFields();
            document.getElementById('ratio').addEventListener('change', updateInputFields);
            
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('sw.js');
            }
        });
    </script>
</body>
</html>
